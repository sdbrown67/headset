<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VR Scene with Controllers</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>

  <script>
    AFRAME.registerComponent('floor-grid', {
      init() {
        const grid = new THREE.GridHelper(200, 200);
        this.el.object3D.add(grid);
      }
    });

    AFRAME.registerComponent('compass-label', {
      schema: { value: { type: 'string' } },
      init() {
        const canvas = document.createElement('canvas');
        canvas.width  = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(0,0,0,0)';
        ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 200px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.data.value, 128, 128);
        const texture = new THREE.CanvasTexture(canvas);
        const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
        const geo = new THREE.PlaneGeometry(10, 10);
        this.el.object3D.add(new THREE.Mesh(geo, mat));
      }
    });


    AFRAME.registerComponent('vertical-controls', {
      schema: {
        speed:    { type: 'number', default: 0.05 },
        deadzone: { type: 'number', default: 0.2 }
      },
      init() {
        this.system = null;
      },
      tick() {
        if (!this.system) {
          this.system = this.el.sceneEl.systems['tracked-controls']
                     || this.el.sceneEl.systems['tracked-controls-webxr']
                     || null;
        }

        let axisY = 0;

        if (this.system && this.system.controllers && this.system.controllers.length) {
          for (const ctrl of this.system.controllers) {
            if (ctrl.handedness === 'right' && ctrl.gamepad) {
              const axes = ctrl.gamepad.axes;
              axisY = axes[3] !== undefined ? axes[3] : 0;
              break;
            }
          }
        }

        if (Math.abs(axisY) < this.data.deadzone) return;
        this.el.object3D.position.y -= axisY * this.data.speed;
      }
    });

    /* Load Scene From Json */
    document.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector("a-scene");

      fetch("scene.json")
        .then(res => res.json())
        .then(objects => {
          objects.forEach(obj => {
            const el = document.createElement("a-entity");
            el.setAttribute("gltf-model", obj.url);
            el.setAttribute("position", obj.position);
            el.setAttribute("rotation", obj.rotation);
            el.setAttribute("scale", obj.scale);
            scene.appendChild(el);
          });
        })
        .catch(err => console.error("scene.json failed:", err));
    });

  </script>
</head>

<body>

<a-scene background="color: #111">

  <!-- FLOOR GRID -->
  <a-entity floor-grid></a-entity>

  <!-- FLOOR -->
  <a-plane
    position="0 -0.01 0"
    rotation="-90 0 0"
    width="200" height="200"
    color="#222">
  </a-plane>

  <!-- PLAYER - aframe-extras movement-controls handles Quest joysticks automatically -->
  <a-entity id="rig"
    movement-controls="controls: gamepad; speed: 0.15;"
    vertical-controls
    position="0 0 5">

    <a-camera id="camera" position="0 1.6 0" wasd-controls-enabled="false" look-controls>
    </a-camera>

    <!-- Direction indicator: flat on floor below player, chevron points forward -->
    <a-entity id="indicator" position="0 0.02 0">
      <a-entity rotation="0 180 0">

        <!-- Ring — thin -->
        <a-torus radius="1.5" radius-tubular="0.005" segments-tubular="64" color="#00ff00" rotation="90 0 0"></a-torus>

        <!-- Chevron left arm — thin, tip meets circle at front, base meets circle at back corners -->
        <a-box width="0.005" height="0.005" depth="2.6"
          color="#00ff00"
          position="-0.47 0 .175"
          rotation="0 21 1.5">
        </a-box>

        <!-- Chevron right arm -->
        <a-box width="0.005" height="0.005" depth="2.6"
          color="#00ff00"
          position="0.47 0 .175"
          rotation="0 -21 1.5">
        </a-box>

      </a-entity>
    </a-entity>

  </a-entity>

  <!-- DEBUG PANEL: big box + text in world space, right in front of start position -->
  <a-plane id="debug-bg" position="0 2 2" width="3" height="2" color="#000000"></a-plane>
  <a-text id="debug-text"
    value="loading..."
    position="-1.4 2.8 2.01"
    color="#00ff00"
    width="3"
    wrap-count="35"
    align="left">
  </a-text>

  <!-- COMPASS LABELS -->
  <a-entity compass-label="value: N" position="0 5 -256"></a-entity>
  <a-entity compass-label="value: S" position="0 5 256"  rotation="0 180 0"></a-entity>
  <a-entity compass-label="value: E" position="256 5 0"  rotation="0 -90 0"></a-entity>
  <a-entity compass-label="value: W" position="-256 5 0" rotation="0 90 0"></a-entity>

  <!-- LIGHTING -->
  <a-light type="ambient"     intensity="0.8"></a-light>
  <a-light type="directional" intensity="0.8" position="1 3 2"></a-light>

</a-scene>

</body>

<script>
  setInterval(() => {
    const el = document.getElementById('debug-text');
    if (!el) return;
    const lines = [];

    const scene = document.querySelector('a-scene');
    const system = scene && (scene.systems['tracked-controls'] || scene.systems['tracked-controls-webxr']);

    if (system && system.controllers && system.controllers.length) {
      system.controllers.forEach((ctrl, i) => {
        const gp = ctrl.gamepad;
        if (!gp) { lines.push(`XR[${i}] no gamepad`); return; }
        lines.push(`XR[${i}] ${ctrl.handedness}`);
        lines.push(`  ${Array.from(gp.axes).map((a,j)=>`a${j}:${a.toFixed(2)}`).join(' ')}`);
      });
    } else {
      lines.push('No XR controllers');
    }

    Array.from(navigator.getGamepads ? navigator.getGamepads() : []).forEach((gp, i) => {
      if (!gp) return;
      lines.push(`GP[${i}]`);
      lines.push(`  ${Array.from(gp.axes).map((a,j)=>`a${j}:${a.toFixed(2)}`).join(' ')}`);
    });

    if (!lines.length) lines.push('No input found');
    el.setAttribute('value', lines.join('\n'));
  }, 300);
</script>
</body>
</html>
