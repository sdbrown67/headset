<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>VR Scene with Controllers</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>

<a-scene
  xr-mode-ui="enabled: true"
  webxr="optionalFeatures: local-floor"
  renderer="colorManagement: true;">

  <!-- Player rig (THIS moves in VR) -->
  <a-entity id="rig" quest-movement>
    <a-camera position="0 1.6 0"></a-camera>
  </a-entity>

  <!-- Lights -->
  <a-light type="ambient" intensity="0.8"></a-light>
  <a-light type="directional" position="2 4 2"></a-light>

</a-scene>

<script>
/* ---------------------------
   QUEST MOVEMENT CONTROLLER
----------------------------*/
AFRAME.registerComponent("quest-movement", {
  init: function () {
    this.rig = this.el;

    this.moveSpeed = 0.05;
    this.turnSpeed = 2.5;

    this.rotationY = 0;
  },

  tick: function () {
    const session = this.el.sceneEl.xrSession;
    if (!session) return;

    const inputSources = session.inputSources;

    let moveX = 0;   // strafe
    let moveY = 0;   // forward/back
    let turnX = 0;   // rotation

    for (const source of inputSources) {
      if (!source.gamepad || !source.handedness) continue;

      const axes = source.gamepad.axes;

      // LEFT controller = movement
      if (source.handedness === "left") {
        moveX = axes[0] || 0;
        moveY = axes[1] || 0;
      }

      // RIGHT controller = turning
      if (source.handedness === "right") {
        turnX = axes[2] || axes[0] || 0;
      }
    }

    // -------- ROTATION (YAW) --------
    this.rotationY -= turnX * this.turnSpeed;
    this.rig.setAttribute("rotation", `0 ${this.rotationY} 0`);

    // -------- MOVEMENT --------
    const angle = THREE.MathUtils.degToRad(this.rotationY);

    const forwardX = Math.sin(angle);
    const forwardZ = -Math.cos(angle);

    const rightX = Math.cos(angle);
    const rightZ = Math.sin(angle);

    const pos = this.rig.object3D.position;

    pos.x += (forwardX * -moveY + rightX * moveX) * this.moveSpeed;
    pos.z += (forwardZ * -moveY + rightZ * moveX) * this.moveSpeed;
  }
});


/* ---------------------------
   LOAD SCENE FROM JSON
----------------------------*/
fetch("scene.json")
  .then(res => res.json())
  .then(objects => {
    const scene = document.querySelector("a-scene");

    objects.forEach(obj => {
      const el = document.createElement("a-entity");

      el.setAttribute("gltf-model", obj.url);
      el.setAttribute("position", obj.position);
      el.setAttribute("rotation", obj.rotation);
      el.setAttribute("scale", obj.scale);

      scene.appendChild(el);
    });
  })
  .catch(err => console.error("scene.json failed:", err));
</script>

</body>
</html>
