<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VR Scene with Controllers</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>

  <script>

    /* ── Floor grid ── */
    AFRAME.registerComponent('floor-grid', {
      init() {
        const grid = new THREE.GridHelper(200, 200);
        this.el.object3D.add(grid);
      }
    });

    /* ── Compass labels ── */
    AFRAME.registerComponent('compass-label', {
      schema: { value: { type: 'string' } },
      init() {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(0,0,0,0)';
        ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 200px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.data.value, 128, 128);
        const texture = new THREE.CanvasTexture(canvas);
        const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
        this.el.object3D.add(new THREE.Mesh(new THREE.PlaneGeometry(10, 10), mat));
      }
    });

    /* ── Axis debug bars ── */
    AFRAME.registerComponent('axis-bars', {
      init() {
        this.system = null;
        this.bars = [];
        this.btns = [];
        for (let i = 0; i < 8; i++) this.bars.push(document.getElementById('bar' + i));
        for (let i = 0; i < 8; i++) this.btns.push(document.getElementById('btn' + i));
      },
      tick() {
        if (!this.system) {
          this.system = this.el.sceneEl.systems['tracked-controls']
                     || this.el.sceneEl.systems['tracked-controls-webxr']
                     || null;
        }
        const axes = [0,0,0,0,0,0,0,0];
        const btns = [0,0,0,0,0,0,0,0];

        if (this.system && this.system.controllers) {
          let axOff = 0, btnOff = 0;
          this.system.controllers.forEach(ctrl => {
            if (!ctrl.gamepad) return;
            if (ctrl.gamepad.axes) {
              Array.from(ctrl.gamepad.axes).forEach((v,i) => { if (axOff+i<8) axes[axOff+i]=v; });
              axOff += ctrl.gamepad.axes.length;
            }
            if (ctrl.gamepad.buttons) {
              Array.from(ctrl.gamepad.buttons).forEach((b,i) => { if (btnOff+i<8) btns[btnOff+i]=b.pressed?1:0; });
              btnOff += ctrl.gamepad.buttons.length;
            }
          });
        }

        axes.forEach((v,i) => {
          const bar = this.bars[i]; if (!bar) return;
          const scale = Math.abs(v), sign = v>=0?1:-1;
          bar.object3D.scale.x = Math.max(0.02, scale);
          bar.object3D.position.x = this.baseX[i] + sign * scale * 0.15;
          bar.setAttribute('color', scale < 0.05 ? '#888888' : (sign>0 ? '#00ffff' : '#ff4444'));
        });

        btns.forEach((v,i) => {
          const btn = this.btns[i]; if (!btn) return;
          btn.setAttribute('color', v ? '#ffff00' : '#333333');
        });
      },
      play() {
        this.baseX = [0,0,0,0,0,0,0,0];
        for (let i=0; i<8; i++) {
          const bar = this.bars[i];
          if (bar) this.baseX[i] = bar.object3D.position.x;
        }
      }
    });

    /* ── Vertical controls ── */
    AFRAME.registerComponent('vertical-controls', {
      schema: {
        speed:    { type: 'number', default: 0.05 },
        deadzone: { type: 'number', default: 0.2 }
      },
      init() {
        this.system = null;
      },
      tick() {
        if (!this.system) {
          this.system = this.el.sceneEl.systems['tracked-controls']
                     || this.el.sceneEl.systems['tracked-controls-webxr']
                     || null;
        }
        let axisY = 0;
        if (this.system && this.system.controllers) {
          let offset = 0;
          for (const ctrl of this.system.controllers) {
            if (ctrl.gamepad && ctrl.gamepad.axes) {
              const localIdx = 7 - offset;
              if (localIdx >= 0 && localIdx < ctrl.gamepad.axes.length) {
                axisY = ctrl.gamepad.axes[localIdx];
              }
              offset += ctrl.gamepad.axes.length;
            }
          }
        }
        if (Math.abs(axisY) < this.data.deadzone) return;
        this.el.object3D.position.y -= axisY * this.data.speed;
      }
    });

    /* ── Asset selector ──
     *
     *  Left stick click (button index 4 on left controller in xr-standard)
     *    → toggle selector panel open/closed
     *    → while open: confirm/select highlighted item
     *
     *  Left stick Y (axis 1 on left controller)
     *    → scroll list while panel is open (movement suppressed)
     *
     *  State bar: hidden when nothing selected,
     *             appears at bottom of view showing selected asset name.
     *
     *  Canvas W/H:
     *    selector panel  1024 x 768
     *    status bar      1024 x 128
     */
    AFRAME.registerComponent('asset-selector', {
      init() {
        this.system       = null;
        this.assets       = [];        // full list loaded from assets.json
        this.highlighted  = 0;         // index in assets[]
        this.selected     = null;      // selected asset object or null
        this.panelOpen    = false;
        this.btnWasDown   = false;     // debounce left stick click
        this.scrollAccum  = 0;         // accumulated axis for scroll steps

        // ── Selector panel (hidden until opened) ──
        this.panelCanvas  = document.createElement('canvas');
        this.panelCanvas.width  = 1024;
        this.panelCanvas.height = 768;
        this.panelCtx     = this.panelCanvas.getContext('2d');
        this.panelTex     = new THREE.CanvasTexture(this.panelCanvas);
        const panelMat    = new THREE.MeshBasicMaterial({ map: this.panelTex, transparent: true, side: THREE.DoubleSide });
        const panelGeo    = new THREE.PlaneGeometry(1.2, 0.9);
        this.panelMesh    = new THREE.Mesh(panelGeo, panelMat);
        this.panelMesh.visible = false;

        // ── Status bar (hidden until something selected) ──
        this.barCanvas    = document.createElement('canvas');
        this.barCanvas.width  = 1024;
        this.barCanvas.height = 128;
        this.barCtx       = this.barCanvas.getContext('2d');
        this.barTex       = new THREE.CanvasTexture(this.barCanvas);
        const barMat      = new THREE.MeshBasicMaterial({ map: this.barTex, transparent: true, side: THREE.DoubleSide });
        const barGeo      = new THREE.PlaneGeometry(1.2, 0.15);
        this.barMesh      = new THREE.Mesh(barGeo, barMat);
        this.barMesh.visible = false;

        // Attach both to camera so they are screen-fixed
        const cam = document.getElementById('camera');
        cam.object3D.add(this.panelMesh);
        cam.object3D.add(this.barMesh);

        // Panel: centred in view
        this.panelMesh.position.set(0, 0, -1.5);
        // Status bar: bottom of view
        this.barMesh.position.set(0, -0.55, -1.5);

        // Load asset list
        fetch('assets.json')
          .then(r => r.json())
          .then(list => { this.assets = list; })
          .catch(err => console.error('asset-selector: failed to load assets.json', err));
      },

      // Returns the left controller gamepad or null
      getLeftGamepad() {
        if (this.system && this.system.controllers) {
          for (const ctrl of this.system.controllers) {
            if (ctrl.handedness === 'left' && ctrl.gamepad) return ctrl.gamepad;
          }
        }
        return null;
      },

      // Get a flat axis value by global index (same method as vertical-controls)
      getFlatAxis(targetIndex) {
        if (this.system && this.system.controllers) {
          let offset = 0;
          for (const ctrl of this.system.controllers) {
            if (ctrl.gamepad && ctrl.gamepad.axes) {
              const local = targetIndex - offset;
              if (local >= 0 && local < ctrl.gamepad.axes.length) {
                return ctrl.gamepad.axes[local];
              }
              offset += ctrl.gamepad.axes.length;
            }
          }
        }
        return 0;
      },

      tick() {
        if (!this.system) {
          this.system = this.el.sceneEl.systems['tracked-controls']
                     || this.el.sceneEl.systems['tracked-controls-webxr']
                     || null;
        }
        if (!this.assets.length) return;

        const gp = this.getLeftGamepad();
        if (!gp) return;

        // ── Left stick click: button 4 in xr-standard ──
        const btnDown = gp.buttons[4] && gp.buttons[4].pressed;
        if (btnDown && !this.btnWasDown) {
          if (!this.panelOpen) {
            // Open panel — suppress movement
            this.panelOpen = true;
            this.panelMesh.visible = true;
            this.el.setAttribute('movement-controls', 'enabled', false);
            this.drawPanel();
          } else {
            // Confirm selection and close — restore movement
            this.selected = this.assets[this.highlighted];
            this.panelOpen = false;
            this.panelMesh.visible = false;
            this.el.setAttribute('movement-controls', 'enabled', true);
            this.drawStatusBar();
            this.barMesh.visible = true;
          }
        }
        this.btnWasDown = btnDown;

        // ── Left stick Y scroll — axis index 1 in flat layout (left controller first) ──
        if (this.panelOpen) {
          const axisY = this.getFlatAxis(1);
          const DEADZONE = 0.3;
          if (Math.abs(axisY) > DEADZONE) {
            this.scrollAccum += axisY * 0.05;
            const steps = Math.trunc(this.scrollAccum);
            if (steps !== 0) {
              this.highlighted = Math.max(0,
                Math.min(this.assets.length - 1, this.highlighted + steps));
              this.scrollAccum -= steps;
              this.drawPanel();
            }
          } else {
            this.scrollAccum = 0;
          }
        }
      },

      drawPanel() {
        const ctx    = this.panelCtx;
        const W      = this.panelCanvas.width;
        const H      = this.panelCanvas.height;
        const ROW_H  = 80;
        const VISIBLE = Math.floor(H / ROW_H);   // rows that fit
        const PAD    = 20;

        // Background
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, W, H);

        // Title
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Select Asset', W / 2, 44);

        // Scroll window: keep highlighted centred
        const half   = Math.floor(VISIBLE / 2);
        const start  = Math.max(0, Math.min(this.highlighted - half,
                                            this.assets.length - VISIBLE));

        for (let i = 0; i < VISIBLE; i++) {
          const idx = start + i;
          if (idx >= this.assets.length) break;
          const asset  = this.assets[idx];
          const y      = 80 + i * ROW_H;
          const isHigh = idx === this.highlighted;

          // Row background
          ctx.fillStyle = isHigh ? '#005588' : 'transparent';
          ctx.fillRect(0, y, W, ROW_H);

          // Highlight marker
          if (isHigh) {
            ctx.fillStyle = '#00aaff';
            ctx.fillRect(0, y, 8, ROW_H);
          }

          // Asset name (use url filename without path/extension as label)
          const label = asset.name || asset.url.split('/').pop().replace(/\.[^.]+$/, '');
          ctx.fillStyle = isHigh ? '#ffffff' : '#aaaaaa';
          ctx.font = isHigh ? 'bold 40px Arial' : '38px Arial';
          ctx.textAlign = 'left';
          ctx.fillText(label, PAD + 16, y + ROW_H * 0.65);
        }

        // Scroll indicator
        if (this.assets.length > VISIBLE) {
          const trackH = H - 80;
          const thumbH = Math.max(40, trackH * (VISIBLE / this.assets.length));
          const thumbY = 80 + (trackH - thumbH) * (start / (this.assets.length - VISIBLE));
          ctx.fillStyle = '#444444';
          ctx.fillRect(W - 12, 80, 8, trackH);
          ctx.fillStyle = '#00aaff';
          ctx.fillRect(W - 12, thumbY, 8, thumbH);
        }

        this.panelTex.needsUpdate = true;
      },

      drawStatusBar() {
        const ctx  = this.barCtx;
        const W    = this.barCanvas.width;
        const H    = this.barCanvas.height;
        const label = this.selected
          ? (this.selected.name || this.selected.url.split('/').pop().replace(/\.[^.]+$/, ''))
          : '';

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = '#00aaff';
        ctx.font = 'bold 56px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('▶  ' + label, W / 2, H / 2);

        this.barTex.needsUpdate = true;
      }
    });

    /* ── Load fixed scene objects from assets.json ── */
    document.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector('a-scene');
      fetch('assets.json')
        .then(r => r.json())
        .then(objects => {
          objects.forEach(obj => {
            if (!obj.fixed) return;
            const el = document.createElement('a-entity');
            el.setAttribute('gltf-model', obj.url);
            el.setAttribute('position', obj.position);
            el.setAttribute('rotation', obj.rotation);
            el.setAttribute('scale', obj.scale);
            scene.appendChild(el);
          });
        })
        .catch(err => console.error('assets.json failed:', err));
    });

  </script>
</head>

<body>
<a-scene background="color: #111">

  <!-- FLOOR GRID -->
  <a-entity floor-grid></a-entity>

  <!-- FLOOR -->
  <a-plane position="0 -0.01 0" rotation="-90 0 0" width="200" height="200" color="#222"></a-plane>

  <!-- PLAYER -->
  <a-entity id="rig"
    movement-controls="controls: gamepad; speed: 0.15;"
    vertical-controls
    asset-selector
    position="0 0 5">

    <a-camera id="camera" position="0 1.6 0" wasd-controls-enabled="false" look-controls></a-camera>

    <!-- AXIS DEBUG BARS + BUTTON INDICATORS -->
    <a-entity axis-bars position="-1.05 1.6 -1.5">
      <!-- Track boxes -->
      <a-box width="0.30" height="0.06" depth="0.005" color="#444444" position="0.00 0 0"></a-box>
      <a-box width="0.30" height="0.06" depth="0.005" color="#444444" position="0.32 0 0"></a-box>
      <a-box width="0.30" height="0.06" depth="0.005" color="#444444" position="0.64 0 0"></a-box>
      <a-box width="0.30" height="0.06" depth="0.005" color="#444444" position="0.96 0 0"></a-box>
      <a-box width="0.30" height="0.06" depth="0.005" color="#444444" position="1.28 0 0"></a-box>
      <a-box width="0.30" height="0.06" depth="0.005" color="#444444" position="1.60 0 0"></a-box>
      <a-box width="0.30" height="0.06" depth="0.005" color="#444444" position="1.92 0 0"></a-box>
      <a-box width="0.30" height="0.06" depth="0.005" color="#444444" position="2.24 0 0"></a-box>
      <!-- Fill bars -->
      <a-box id="bar0" width="0.30" height="0.06" depth="0.01" color="#888888" position="0.00 0 0.005"></a-box>
      <a-box id="bar1" width="0.30" height="0.06" depth="0.01" color="#888888" position="0.32 0 0.005"></a-box>
      <a-box id="bar2" width="0.30" height="0.06" depth="0.01" color="#888888" position="0.64 0 0.005"></a-box>
      <a-box id="bar3" width="0.30" height="0.06" depth="0.01" color="#888888" position="0.96 0 0.005"></a-box>
      <a-box id="bar4" width="0.30" height="0.06" depth="0.01" color="#888888" position="1.28 0 0.005"></a-box>
      <a-box id="bar5" width="0.30" height="0.06" depth="0.01" color="#888888" position="1.60 0 0.005"></a-box>
      <a-box id="bar6" width="0.30" height="0.06" depth="0.01" color="#888888" position="1.92 0 0.005"></a-box>
      <a-box id="bar7" width="0.30" height="0.06" depth="0.01" color="#888888" position="2.24 0 0.005"></a-box>
      <!-- Button indicators (yellow when pressed) -->
      <a-box id="btn0" width="0.22" height="0.06" depth="0.01" color="#333333" position="0.00 -0.12 0.005"></a-box>
      <a-box id="btn1" width="0.22" height="0.06" depth="0.01" color="#333333" position="0.32 -0.12 0.005"></a-box>
      <a-box id="btn2" width="0.22" height="0.06" depth="0.01" color="#333333" position="0.64 -0.12 0.005"></a-box>
      <a-box id="btn3" width="0.22" height="0.06" depth="0.01" color="#333333" position="0.96 -0.12 0.005"></a-box>
      <a-box id="btn4" width="0.22" height="0.06" depth="0.01" color="#333333" position="1.28 -0.12 0.005"></a-box>
      <a-box id="btn5" width="0.22" height="0.06" depth="0.01" color="#333333" position="1.60 -0.12 0.005"></a-box>
      <a-box id="btn6" width="0.22" height="0.06" depth="0.01" color="#333333" position="1.92 -0.12 0.005"></a-box>
      <a-box id="btn7" width="0.22" height="0.06" depth="0.01" color="#333333" position="2.24 -0.12 0.005"></a-box>
    </a-entity>

    <!-- DIRECTION INDICATOR -->
    <a-entity id="indicator" position="0 0.02 0">
      <a-entity rotation="0 180 0">
        <a-torus radius="1.5" radius-tubular="0.005" segments-tubular="64" color="#00ff00" rotation="90 0 0"></a-torus>
        <a-box width="0.005" height="0.005" depth="2.6" color="#00ff00" position="-0.47 0  0.175" rotation="0  21 1.5"></a-box>
        <a-box width="0.005" height="0.005" depth="2.6" color="#00ff00" position=" 0.47 0  0.175" rotation="0 -21 1.5"></a-box>
      </a-entity>
    </a-entity>

  </a-entity>

  <!-- COMPASS LABELS -->
  <a-entity compass-label="value: N" position="0 5 -256"></a-entity>
  <a-entity compass-label="value: S" position="0 5  256" rotation="0 180 0"></a-entity>
  <a-entity compass-label="value: E" position=" 256 5 0" rotation="0 -90 0"></a-entity>
  <a-entity compass-label="value: W" position="-256 5 0" rotation="0  90 0"></a-entity>

  <!-- LIGHTING -->
  <a-light type="ambient"     intensity="0.8"></a-light>
  <a-light type="directional" intensity="0.8" position="1 3 2"></a-light>

</a-scene>
</body>
</html>
