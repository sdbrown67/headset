<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VR Scene with Controllers</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>

  <script>
    AFRAME.registerComponent('floor-grid', {
      init() {
        const grid = new THREE.GridHelper(200, 200);
        this.el.object3D.add(grid);
      }
    });

    AFRAME.registerComponent('compass-label', {
      schema: { value: { type: 'string' } },
      init() {
        const canvas = document.createElement('canvas');
        canvas.width  = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(0,0,0,0)';
        ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 200px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.data.value, 128, 128);
        const texture = new THREE.CanvasTexture(canvas);
        const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
        const geo = new THREE.PlaneGeometry(10, 10);
        this.el.object3D.add(new THREE.Mesh(geo, mat));
      }
    });


    AFRAME.registerComponent('axis-bars', {
      // Reads all axes from all controllers and drives 8 bar sliders
      // Bars are children already in the DOM, named bar0..bar7
      init() {
        this.system = null;
        this.bars = [];
        for (let i = 0; i < 8; i++) {
          this.bars.push(document.getElementById('bar' + i));
        }
      },
      tick() {
        if (!this.system) {
          this.system = this.el.sceneEl.systems['tracked-controls']
                     || this.el.sceneEl.systems['tracked-controls-webxr']
                     || null;
        }

        // Collect all axes from all sources into a flat array
        const axes = [0,0,0,0, 0,0,0,0];

        if (this.system && this.system.controllers) {
          let offset = 0;
          this.system.controllers.forEach(ctrl => {
            if (ctrl.gamepad && ctrl.gamepad.axes) {
              Array.from(ctrl.gamepad.axes).forEach((v, i) => {
                if (offset + i < 8) axes[offset + i] = v;
              });
              offset += ctrl.gamepad.axes.length;
            }
          });
        }

        // Also try navigator.getGamepads as fallback
        if (axes.every(v => v === 0)) {
          let offset = 0;
          Array.from(navigator.getGamepads ? navigator.getGamepads() : []).forEach(gp => {
            if (!gp) return;
            Array.from(gp.axes).forEach((v, i) => {
              if (offset + i < 8) axes[offset + i] = v;
            });
            offset += gp.axes.length;
          });
        }

        // Update each bar: scale x from 0..1 based on axis -1..1
        axes.forEach((v, i) => {
          const bar = this.bars[i];
          if (!bar) return;
          const scale = Math.abs(v);           // 0..1
          const sign  = v >= 0 ? 1 : -1;
          bar.object3D.scale.x = Math.max(0.01, scale);
          // Shift so bar grows from centre: offset = sign * (scale/2) * barWidth
          bar.object3D.position.x = sign * scale * 0.15;
          // Colour: positive=cyan, negative=red, idle=grey
          const col = scale < 0.05 ? '#888888' : (sign > 0 ? '#00ffff' : '#ff4444');
          bar.setAttribute('color', col);
        });
      }
    });


      schema: {
        speed:    { type: 'number', default: 0.05 },
        deadzone: { type: 'number', default: 0.2 }
      },
      init() {
        this.system = null;
      },
      tick() {
        if (!this.system) {
          this.system = this.el.sceneEl.systems['tracked-controls']
                     || this.el.sceneEl.systems['tracked-controls-webxr']
                     || null;
        }

        let axisY = 0;

        if (this.system && this.system.controllers && this.system.controllers.length) {
          for (const ctrl of this.system.controllers) {
            if (ctrl.handedness === 'right' && ctrl.gamepad) {
              const axes = ctrl.gamepad.axes;
              axisY = axes[3] !== undefined ? axes[3] : 0;
              break;
            }
          }
        }

        if (Math.abs(axisY) < this.data.deadzone) return;
        this.el.object3D.position.y -= axisY * this.data.speed;
      }
    });

    /* Load Scene From Json */
    document.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector("a-scene");

      fetch("scene.json")
        .then(res => res.json())
        .then(objects => {
          objects.forEach(obj => {
            const el = document.createElement("a-entity");
            el.setAttribute("gltf-model", obj.url);
            el.setAttribute("position", obj.position);
            el.setAttribute("rotation", obj.rotation);
            el.setAttribute("scale", obj.scale);
            scene.appendChild(el);
          });
        })
        .catch(err => console.error("scene.json failed:", err));
    });

  </script>
</head>

<body>

<a-scene background="color: #111">

  <!-- FLOOR GRID -->
  <a-entity floor-grid></a-entity>

  <!-- FLOOR -->
  <a-plane
    position="0 -0.01 0"
    rotation="-90 0 0"
    width="200" height="200"
    color="#222">
  </a-plane>

  <!-- PLAYER - aframe-extras movement-controls handles Quest joysticks automatically -->
  <a-entity id="rig"
    movement-controls="controls: gamepad; speed: 0.15;"
    vertical-controls
    position="0 0 5">

    <a-camera id="camera" position="0 1.6 0" wasd-controls-enabled="false" look-controls>
    </a-camera>

    <!-- AXIS DEBUG BARS: 8 bars, floats in front of camera at eye level, attached to rig -->
    <!-- Each bar = white track + coloured fill. Bars are 0.3 wide, spaced 0.1 apart -->
    <a-entity axis-bars position="0 1.6 -1.5">
      <!-- Labels row (white track boxes) -->
      <a-box width="0.30" height="0.04" depth="0.01" color="#333333" position="-0.35 0.08 0"></a-box>
      <a-box width="0.30" height="0.04" depth="0.01" color="#333333" position="-0.05 0.08 0"></a-box>
      <a-box width="0.30" height="0.04" depth="0.01" color="#333333" position=" 0.25 0.08 0"></a-box>
      <a-box width="0.30" height="0.04" depth="0.01" color="#333333" position=" 0.55 0.08 0"></a-box>
      <a-box width="0.30" height="0.04" depth="0.01" color="#333333" position=" 0.85 0.08 0"></a-box>
      <a-box width="0.30" height="0.04" depth="0.01" color="#333333" position=" 1.15 0.08 0"></a-box>
      <a-box width="0.30" height="0.04" depth="0.01" color="#333333" position=" 1.45 0.08 0"></a-box>
      <a-box width="0.30" height="0.04" depth="0.01" color="#333333" position=" 1.75 0.08 0"></a-box>
      <!-- Fill bars (driven by axis-bars component) -->
      <a-box id="bar0" width="0.30" height="0.04" depth="0.015" color="#888888" position="-0.35 0.08 0"></a-box>
      <a-box id="bar1" width="0.30" height="0.04" depth="0.015" color="#888888" position="-0.05 0.08 0"></a-box>
      <a-box id="bar2" width="0.30" height="0.04" depth="0.015" color="#888888" position=" 0.25 0.08 0"></a-box>
      <a-box id="bar3" width="0.30" height="0.04" depth="0.015" color="#888888" position=" 0.55 0.08 0"></a-box>
      <a-box id="bar4" width="0.30" height="0.04" depth="0.015" color="#888888" position=" 0.85 0.08 0"></a-box>
      <a-box id="bar5" width="0.30" height="0.04" depth="0.015" color="#888888" position=" 1.15 0.08 0"></a-box>
      <a-box id="bar6" width="0.30" height="0.04" depth="0.015" color="#888888" position=" 1.45 0.08 0"></a-box>
      <a-box id="bar7" width="0.30" height="0.04" depth="0.015" color="#888888" position=" 1.75 0.08 0"></a-box>
    </a-entity>

    <!-- Direction indicator: flat on floor below player, chevron points forward -->
    <a-entity id="indicator" position="0 0.02 0">
      <a-entity rotation="0 180 0">

        <!-- Ring — thin -->
        <a-torus radius="1.5" radius-tubular="0.005" segments-tubular="64" color="#00ff00" rotation="90 0 0"></a-torus>

        <!-- Chevron left arm — thin, tip meets circle at front, base meets circle at back corners -->
        <a-box width="0.005" height="0.005" depth="2.6"
          color="#00ff00"
          position="-0.47 0 .175"
          rotation="0 21 1.5">
        </a-box>

        <!-- Chevron right arm -->
        <a-box width="0.005" height="0.005" depth="2.6"
          color="#00ff00"
          position="0.47 0 .175"
          rotation="0 -21 1.5">
        </a-box>

      </a-entity>
    </a-entity>

  </a-entity>


  <!-- COMPASS LABELS -->
  <a-entity compass-label="value: N" position="0 5 -256"></a-entity>
  <a-entity compass-label="value: S" position="0 5 256"  rotation="0 180 0"></a-entity>
  <a-entity compass-label="value: E" position="256 5 0"  rotation="0 -90 0"></a-entity>
  <a-entity compass-label="value: W" position="-256 5 0" rotation="0 90 0"></a-entity>

  <!-- LIGHTING -->
  <a-light type="ambient"     intensity="0.8"></a-light>
  <a-light type="directional" intensity="0.8" position="1 3 2"></a-light>

</a-scene>

</body>
</html>
