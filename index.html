<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>VR Scene with Controllers</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>

<a-scene
  xr-mode-ui="enabled: true"
  webxr="optionalFeatures: local-floor"
  renderer="colorManagement: true;">

  <!-- Player rig (THIS moves in VR) -->
  <a-entity id="rig" quest-movement>
    <a-camera id="camera" position="0 1.6 0"></a-camera>
  </a-entity>

  <!-- Lights -->
  <a-light type="ambient" intensity="0.8"></a-light>
  <a-light type="directional" position="2 4 2"></a-light>

</a-scene>

<script>
/* ---------------------------
   QUEST MOVEMENT CONTROLLER
----------------------------*/
AFRAME.registerComponent("quest-movement", {
  init: function () {
    this.rig    = this.el;
    this.camera = this.el.querySelector("#camera");

    this.moveSpeed = 0.05;  // meters per tick
    this.turnSpeed = 2.0;   // degrees per tick for smooth turn

    this.rigYaw = 0;        // accumulated body yaw (degrees)
  },

  tick: function () {
    const session = this.el.sceneEl.xrSession;
    if (!session) return;

    const inputSources = session.inputSources;

    let moveX = 0;  // left stick horizontal  → strafe
    let moveZ = 0;  // left stick vertical    → forward/back
    let turnX = 0;  // right stick horizontal → body yaw

    for (const source of inputSources) {
      if (!source.gamepad || !source.handedness) continue;

      // Quest thumbstick axes: index 2 = X, index 3 = Y
      const axes = source.gamepad.axes;

      if (source.handedness === "left") {
        moveX = axes[2] || 0;
        moveZ = axes[3] || 0;
      }

      if (source.handedness === "right") {
        turnX = axes[2] || 0;
        // axes[3] (right stick Y) intentionally unused —
        // vertical look is handled by the headset physically
      }
    }

    // -------- BODY TURN (rig yaw only) --------
    this.rigYaw -= turnX * this.turnSpeed;
    this.rig.object3D.rotation.y = THREE.MathUtils.degToRad(this.rigYaw);

    // -------- HEAD-RELATIVE MOVEMENT --------
    // In WebXR + A-Frame, the actual headset pose is applied to the
    // camera's internal Three.js object. We read it via the scene's
    // active camera rather than the a-camera entity, which ensures
    // we get the true physical head orientation including XR tracking.
    const xrCamera = this.el.sceneEl.renderer.xr.getCamera();
    const camQuat  = xrCamera
      ? xrCamera.quaternion
      : (this.camera.object3D.getWorldQuaternion(new THREE.Quaternion()), this.camera.object3D.quaternion);

    // Project headset forward direction onto the horizontal plane
    const headForward = new THREE.Vector3(0, 0, -1).applyQuaternion(camQuat);
    headForward.y = 0;
    headForward.normalize();

    // Right vector is 90° clockwise from forward on the XZ plane
    const headRight = new THREE.Vector3(headForward.z, 0, -headForward.x);

    const pos = this.rig.object3D.position;
    // Stick forward = negative moveZ, stick back = positive moveZ.
    // Negate so forward stick = move in headForward direction.
    pos.x += (-headForward.x * moveZ + headRight.x * moveX) * this.moveSpeed;
    pos.z += (-headForward.z * moveZ + headRight.z * moveX) * this.moveSpeed;
  }
});


/* ---------------------------
   LOAD SCENE FROM JSON
----------------------------*/
fetch("scene.json")
  .then(res => res.json())
  .then(objects => {
    const scene = document.querySelector("a-scene");

    objects.forEach(obj => {
      const el = document.createElement("a-entity");

      el.setAttribute("gltf-model", obj.url);
      el.setAttribute("position", obj.position);
      el.setAttribute("rotation", obj.rotation);
      el.setAttribute("scale", obj.scale);

      scene.appendChild(el);
    });
  })
  .catch(err => console.error("scene.json failed:", err));
</script>

</body>
</html>
