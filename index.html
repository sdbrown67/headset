<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>VR Scene with Controllers</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>

<a-scene
  xr-mode-ui="enabled: true"
  webxr="optionalFeatures: local-floor"
  renderer="colorManagement: true;">

  <!-- Player rig (THIS moves in VR) -->
  <a-entity id="rig" quest-movement>
    <a-camera id="camera" position="0 1.6 0" look-controls="enabled: false"></a-camera>
  </a-entity>

  <!-- Lights -->
  <a-light type="ambient" intensity="0.8"></a-light>
  <a-light type="directional" position="2 4 2"></a-light>

</a-scene>

<script>
/* ---------------------------
   QUEST MOVEMENT CONTROLLER
----------------------------*/
AFRAME.registerComponent("quest-movement", {
  init: function () {
    this.rig    = this.el;
    this.camera = this.el.querySelector("#camera");

    this.moveSpeed  = 0.05;
    this.turnSpeed  = 2.0;   // yaw degrees per tick
    this.pitchSpeed = 1.5;   // pitch degrees per tick

    this.yaw   = 0;  // rig Y rotation
    this.pitch = 0;  // camera X rotation
  },

  tick: function () {
    const session = this.el.sceneEl.xrSession;
    if (!session) return;

    const inputSources = session.inputSources;

    let moveX = 0;   // strafe  (left stick horizontal)
    let moveZ = 0;   // forward (left stick vertical)
    let turnX = 0;   // yaw     (right stick horizontal)
    let turnY = 0;   // pitch   (right stick vertical)

    for (const source of inputSources) {
      if (!source.gamepad || !source.handedness) continue;

      // Quest thumbstick axes are at index 2 (X) and 3 (Y)
      const axes = source.gamepad.axes;

      if (source.handedness === "left") {
        moveX = axes[2] || 0;
        moveZ = axes[3] || 0;
      }

      if (source.handedness === "right") {
        turnX = axes[2] || 0;
        turnY = axes[3] || 0;
      }
    }

    // -------- YAW (rig rotates left/right) --------
    this.yaw -= turnX * this.turnSpeed;
    this.rig.object3D.rotation.y = THREE.MathUtils.degToRad(this.yaw);

    // -------- PITCH (camera looks up/down) --------
    this.pitch -= turnY * this.pitchSpeed;
    this.pitch  = Math.max(-85, Math.min(85, this.pitch)); // clamp to avoid flipping
    this.camera.object3D.rotation.x = THREE.MathUtils.degToRad(this.pitch);

    // -------- MOVEMENT (relative to current yaw) --------
    const angle = THREE.MathUtils.degToRad(this.yaw);

    const fwdX =  Math.sin(angle);
    const fwdZ = -Math.cos(angle);
    const rgtX =  Math.cos(angle);
    const rgtZ =  Math.sin(angle);

    const pos = this.rig.object3D.position;
    pos.x += (fwdX * -moveZ + rgtX * moveX) * this.moveSpeed;
    pos.z += (fwdZ * -moveZ + rgtZ * moveX) * this.moveSpeed;
  }
});


/* ---------------------------
   LOAD SCENE FROM JSON
----------------------------*/
fetch("scene.json")
  .then(res => res.json())
  .then(objects => {
    const scene = document.querySelector("a-scene");

    objects.forEach(obj => {
      const el = document.createElement("a-entity");

      el.setAttribute("gltf-model", obj.url);
      el.setAttribute("position", obj.position);
      el.setAttribute("rotation", obj.rotation);
      el.setAttribute("scale", obj.scale);

      scene.appendChild(el);
    });
  })
  .catch(err => console.error("scene.json failed:", err));
</script>

</body>
</html>
