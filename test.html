<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VR Flight Test</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    AFRAME.registerComponent('floor-grid', {
      init() {
        const grid = new THREE.GridHelper(
          200,  // size
          200   // divisions
        );
        this.el.object3D.add(grid);
      }
    });

    // Locomotion: left stick moves/strafes, right stick turns
    AFRAME.registerComponent('vr-locomotion', {
      init() {
        this.moveX = 0;
        this.moveY = 0;
        this.turnX = 0;

        this.moveSpeed = 0.10;
        this.turnSpeed = 0.035;
        this.deadZone = 0.15;

        this.forward = new THREE.Vector3();
        this.right   = new THREE.Vector3();
        this.up      = new THREE.Vector3(0, 1, 0);

        const scene = this.el.sceneEl;

        // Left controller — move & strafe
        scene.addEventListener('controllerconnected', () => {
          const leftEl  = document.querySelector('#left-controller');
          const rightEl = document.querySelector('#right-controller');

          if (leftEl) {
            leftEl.addEventListener('thumbstickmoved', (e) => {
              this.moveX = Math.abs(e.detail.x) < this.deadZone ? 0 : e.detail.x;
              this.moveY = Math.abs(e.detail.y) < this.deadZone ? 0 : -e.detail.y;
            });
          }

          if (rightEl) {
            rightEl.addEventListener('thumbstickmoved', (e) => {
              this.turnX = Math.abs(e.detail.x) < this.deadZone ? 0 : e.detail.x;
            });
          }
        });
      },

      tick() {
        const camera = document.querySelector('#camera');
        if (!camera || !camera.object3D) return;

        // Turn
        this.el.object3D.rotation.y -= this.turnX * this.turnSpeed;

        // Forward direction from camera gaze (flattened to XZ plane)
        camera.object3D.getWorldDirection(this.forward);
        this.forward.y = 0;
        this.forward.normalize();

        // Right vector
        this.right.crossVectors(this.forward, this.up).normalize();

        // Move forward/back
        this.el.object3D.position.addScaledVector(this.forward, this.moveY * this.moveSpeed);

        // Strafe
        this.el.object3D.position.addScaledVector(this.right, this.moveX * this.moveSpeed);
      }
    });
  </script>
</head>

<body>

<a-scene background="color: #111">

  <!-- FLOOR GRID -->
  <a-entity floor-grid></a-entity>

  <!-- FLOOR -->
  <a-plane
    position="0 -0.01 0"
    rotation="-90 0 0"
    width="200"
    height="200"
    color="#222">
  </a-plane>

  <!-- PLAYER -->
  <a-entity
    id="rig"
    vr-locomotion
    position="0 1.6 5">

    <a-camera
      id="camera"
      wasd-controls-enabled="false">
    </a-camera>

    <!-- Quest 3 controllers -->
    <a-entity
      id="left-controller"
      oculus-touch-controls="hand: left">
    </a-entity>

    <a-entity
      id="right-controller"
      oculus-touch-controls="hand: right">
    </a-entity>

  </a-entity>

  <!-- ORIGIN -->
  <a-box
    position="0 0.5 0"
    color="red">
  </a-box>

  <!-- NORTH -->
  <a-box
    position="0 0.5 -10"
    color="blue">
  </a-box>

  <!-- EAST -->
  <a-box
    position="10 0.5 0"
    color="green">
  </a-box>

  <!-- WEST -->
  <a-box
    position="-10 0.5 0"
    color="yellow">
  </a-box>

  <!-- FLIGHT TARGETS -->

  <a-box
    position="0 5 -20"
    color="orange">
  </a-box>

  <a-box
    position="10 10 -30"
    color="purple">
  </a-box>

  <a-box
    position="-15 8 -25"
    color="cyan">
  </a-box>

  <a-sphere
    position="0 15 -40"
    radius="2"
    color="#FF66AA">
  </a-sphere>

  <!-- LIGHTING -->

  <a-light
    type="ambient"
    intensity="0.8">
  </a-light>

  <a-light
    type="directional"
    intensity="0.8"
    position="1 3 2">
  </a-light>

</a-scene>

</body>
</html>
