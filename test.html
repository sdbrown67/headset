<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VR Flight Test</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    AFRAME.registerComponent('floor-grid', {
      init() {
        const grid = new THREE.GridHelper(
          200,  // size
          200   // divisions
        );
        this.el.object3D.add(grid);
      }
    });

    AFRAME.registerComponent('compass-label', {
      schema: { value: { type: 'string' } },
      init() {
        const canvas = document.createElement('canvas');
        canvas.width  = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = 'rgba(0,0,0,0)';
        ctx.fillRect(0, 0, 256, 256);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 200px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.data.value, 128, 128);

        const texture = new THREE.CanvasTexture(canvas);
        const mat = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          side: THREE.DoubleSide
        });
        const geo = new THREE.PlaneGeometry(10, 10);
        const mesh = new THREE.Mesh(geo, mat);
        this.el.object3D.add(mesh);
      }
    });
    // Uses session.inputSources directly — same approach as index.html
    AFRAME.registerComponent('vr-locomotion', {
      init() {
        this.moveSpeed = 0.05;   // metres per tick
        this.turnSpeed = 2.0;    // degrees per tick
        this.rigYaw    = 0;      // accumulated body yaw in degrees
      },

      tick() {
        const session = this.el.sceneEl.xrSession;
        if (!session) return;

        let moveX = 0;
        let moveZ = 0;
        let turnX = 0;

        for (const source of session.inputSources) {
          if (!source.gamepad || !source.handedness) continue;

          // Quest thumbstick: axes[2] = X, axes[3] = Y
          const axes = source.gamepad.axes;

          if (source.handedness === 'left') {
            moveX = axes[2] || 0;
            moveZ = axes[3] || 0;
          }

          if (source.handedness === 'right') {
            turnX = axes[2] || 0;
          }
        }

        // Turn rig
        this.rigYaw -= turnX * this.turnSpeed;
        this.el.object3D.rotation.y = THREE.MathUtils.degToRad(this.rigYaw);

        // Move relative to body facing direction
        const angle = THREE.MathUtils.degToRad(this.rigYaw);
        const fwdX =  Math.sin(angle);
        const fwdZ = -Math.cos(angle);
        const rgtX =  Math.cos(angle);
        const rgtZ =  Math.sin(angle);

        const pos = this.el.object3D.position;
        pos.x += (fwdX * -moveZ + rgtX * moveX) * this.moveSpeed;
        pos.z += (fwdZ * -moveZ + rgtZ * moveX) * this.moveSpeed;
      }
    });
  </script>
</head>

<body>

<a-scene background="color: #111">

  <!-- FLOOR GRID -->
  <a-entity floor-grid></a-entity>

  <!-- FLOOR -->
  <a-plane
    position="0 -0.01 0"
    rotation="-90 0 0"
    width="200"
    height="200"
    color="#222">
  </a-plane>

  <!-- PLAYER -->
  <a-entity
    id="rig"
    vr-locomotion
    position="0 1.6 5">

    <a-camera
      id="camera"
      wasd-controls-enabled="false">
    </a-camera>

    <!-- Forward direction arrow — large, at eye level, in front of camera -->
    <a-entity position="0 0 0">

      <!-- Shaft -->
      <a-cylinder
        position="0 1.6 -3"
        radius="0.08"
        height="2.5"
        rotation="90 0 0"
        color="#00FF00">
      </a-cylinder>

      <!-- Tip -->
      <a-cone
        position="0 1.6 -4.4"
        radius-bottom="0.25"
        radius-top="0"
        height="0.8"
        rotation="90 0 0"
        color="#00FF00">
      </a-cone>

    </a-entity>

  </a-entity>

  <!-- COMPASS LABELS -->

  <!-- NORTH -->
  <a-entity
    compass-label="value: N"
    position="0 5 -40"
    rotation="0 0 0">
  </a-entity>

  <!-- SOUTH -->
  <a-entity
    compass-label="value: S"
    position="0 5 40"
    rotation="0 180 0">
  </a-entity>

  <!-- EAST -->
  <a-entity
    compass-label="value: E"
    position="40 5 0"
    rotation="0 -90 0">
  </a-entity>

  <!-- WEST -->
  <a-entity
    compass-label="value: W"
    position="-40 5 0"
    rotation="0 90 0">
  </a-entity>
  <a-box
    position="0 0.5 0"
    color="red">
  </a-box>

  <!-- NORTH -->
  <a-box
    position="0 0.5 -10"
    color="blue">
  </a-box>

  <!-- EAST -->
  <a-box
    position="10 0.5 0"
    color="green">
  </a-box>

  <!-- WEST -->
  <a-box
    position="-10 0.5 0"
    color="yellow">
  </a-box>

  <!-- FLIGHT TARGETS -->

  <a-box
    position="0 5 -20"
    color="orange">
  </a-box>

  <a-box
    position="10 10 -30"
    color="purple">
  </a-box>

  <a-box
    position="-15 8 -25"
    color="cyan">
  </a-box>

  <a-sphere
    position="0 15 -40"
    radius="2"
    color="#FF66AA">
  </a-sphere>

  <!-- LIGHTING -->

  <a-light
    type="ambient"
    intensity="0.8">
  </a-light>

  <a-light
    type="directional"
    intensity="0.8"
    position="1 3 2">
  </a-light>

</a-scene>

</body>
</html>
