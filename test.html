<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VR Flight Test</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    AFRAME.registerComponent('floor-grid', {
      init() {
        const grid = new THREE.GridHelper(200, 200);
        this.el.object3D.add(grid);
      }
    });

    AFRAME.registerComponent('compass-label', {
      schema: { value: { type: 'string' } },
      init() {
        const canvas = document.createElement('canvas');
        canvas.width  = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(0,0,0,0)';
        ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 200px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.data.value, 128, 128);
        const texture = new THREE.CanvasTexture(canvas);
        const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
        const geo = new THREE.PlaneGeometry(10, 10);
        this.el.object3D.add(new THREE.Mesh(geo, mat));
      }
    });

    AFRAME.registerComponent('vr-locomotion', {
      init() {
        this.moveSpeed = 0.05;
        this.turnSpeed = 2.0;
        this.rigYaw    = 0;
      },

      tick() {
        const session = this.el.sceneEl.xrSession;
        if (!session) return;

        let moveX = 0;
        let moveZ = 0;
        let turnX = 0;

        for (const source of session.inputSources) {
          if (!source.gamepad || !source.handedness) continue;
          const axes = source.gamepad.axes;
          if (source.handedness === 'left') {
            moveX = axes[2] || 0;
            moveZ = axes[3] || 0;
          }
          if (source.handedness === 'right') {
            turnX = axes[2] || 0;
          }
        }

        this.rigYaw = (this.rigYaw - turnX * this.turnSpeed) % 360;

        const turnRig = document.querySelector('#turn-rig');
        if (turnRig) {
          turnRig.object3D.rotation.set(0, THREE.MathUtils.degToRad(this.rigYaw), 0);
        }

        // rigYaw=0 → facing -Z (north).
        // Quest axes[3]: push forward = NEGATIVE value (verified from index.html working code)
        // index.html uses:  pos.x += fwdX * -moveZ   which works there
        // The flip at E/W means rigYaw is accumulating wrongly.
        // Root fix: sync rigYaw to actual turn-rig rotation each frame instead of accumulating.
        const actualYaw = THREE.MathUtils.radToDeg(turnRig ? turnRig.object3D.rotation.y : 0);
        const rad  = THREE.MathUtils.degToRad(actualYaw);

        const fwdX =  Math.sin(rad);
        const fwdZ = -Math.cos(rad);
        const rgtX =  Math.cos(rad);
        const rgtZ =  Math.sin(rad);

        const pos = this.el.object3D.position;
        pos.x += (fwdX * moveZ + rgtX * moveX) * this.moveSpeed;
        pos.z += (fwdZ * moveZ + rgtZ * moveX) * this.moveSpeed;
      }
    });
  </script>
</head>

<body>

<a-scene background="color: #111">

  <!-- FLOOR GRID -->
  <a-entity floor-grid></a-entity>

  <!-- FLOOR -->
  <a-plane
    position="0 -0.01 0"
    rotation="-90 0 0"
    width="200" height="200"
    color="#222">
  </a-plane>

  <!-- PLAYER -->
  <a-entity id="move-rig" vr-locomotion position="0 0 5">
    <a-entity id="turn-rig">

      <a-camera id="camera" position="0 1.6 0" wasd-controls-enabled="false"></a-camera>

      <!-- Direction indicator attached to camera so it tilts with head look-down -->
      <!-- Positioned 1.5m in front at chest height so glancing down shows it -->
      <a-entity id="indicator" position="0 1.6 0">

        <!-- Tilted 60deg so player sees it by glancing slightly downward -->
        <a-entity rotation="-60 0 0" position="0 0 -1.2">

          <!-- Ring -->
          <a-torus
            radius="0.4"
            radius-tubular="0.02"
            segments-tubular="48"
            color="#00ff00"
            rotation="90 0 0">
          </a-torus>

          <!-- Chevron left arm -->
          <a-box
            width="0.03" height="0.03" depth="0.55"
            color="#00ff00"
            position="-0.12 0 0.03"
            rotation="0 -30 0">
          </a-box>

          <!-- Chevron right arm -->
          <a-box
            width="0.03" height="0.03" depth="0.55"
            color="#00ff00"
            position="0.12 0 0.03"
            rotation="0 30 0">
          </a-box>

        </a-entity>
      </a-entity>

    </a-entity>
  </a-entity>

  <!-- COMPASS LABELS -->
  <a-entity compass-label="value: N" position="0 5 -40"></a-entity>
  <a-entity compass-label="value: S" position="0 5 40"  rotation="0 180 0"></a-entity>
  <a-entity compass-label="value: E" position="40 5 0"  rotation="0 -90 0"></a-entity>
  <a-entity compass-label="value: W" position="-40 5 0" rotation="0 90 0"></a-entity>

  <!-- MARKERS -->
  <a-box position="0 0.5 0"    color="red"></a-box>
  <a-box position="0 0.5 -10"  color="blue"></a-box>
  <a-box position="10 0.5 0"   color="green"></a-box>
  <a-box position="-10 0.5 0"  color="yellow"></a-box>

  <!-- FLIGHT TARGETS -->
  <a-box    position="0 5 -20"   color="orange"></a-box>
  <a-box    position="10 10 -30" color="purple"></a-box>
  <a-box    position="-15 8 -25" color="cyan"></a-box>
  <a-sphere position="0 15 -40"  radius="2" color="#FF66AA"></a-sphere>

  <!-- LIGHTING -->
  <a-light type="ambient"     intensity="0.8"></a-light>
  <a-light type="directional" intensity="0.8" position="1 3 2"></a-light>

</a-scene>

</body>
</html>
