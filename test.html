<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VR Flight Test</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    AFRAME.registerComponent('floor-grid', {
      init() {
        const grid = new THREE.GridHelper(200, 200);
        this.el.object3D.add(grid);
      }
    });

    AFRAME.registerComponent('compass-label', {
      schema: { value: { type: 'string' } },
      init() {
        const canvas = document.createElement('canvas');
        canvas.width  = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(0,0,0,0)';
        ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 200px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.data.value, 128, 128);
        const texture = new THREE.CanvasTexture(canvas);
        const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
        const geo = new THREE.PlaneGeometry(10, 10);
        this.el.object3D.add(new THREE.Mesh(geo, mat));
      }
    });

    AFRAME.registerComponent('direction-indicator', {
      init() {
        const color = 0x00ff00;
        const lineWidth = 1; // note: WebGL ignores linewidth > 1 on most platforms

        // --- Ring ---
        const ringGeo = new THREE.BufferGeometry();
        const ringPoints = [];
        const segments = 64;
        const radius = 2.0;
        for (let i = 0; i <= segments; i++) {
          const a = (i / segments) * Math.PI * 2;
          ringPoints.push(Math.cos(a) * radius, 0, Math.sin(a) * radius);
        }
        ringGeo.setAttribute('position', new THREE.Float32BufferAttribute(ringPoints, 3));
        const ringMat = new THREE.LineBasicMaterial({ color });
        const ring = new THREE.Line(ringGeo, ringMat);
        this.el.object3D.add(ring);

        // --- Chevron (open triangle — two lines from base corners to tip) ---
        // Tip points forward (negative Z), base spans behind tip
        const tipZ    = -1.6;
        const baseZ   =  1.0;
        const baseX   =  1.1;

        // Left arm: base-left to tip
        const leftGeo = new THREE.BufferGeometry();
        leftGeo.setAttribute('position', new THREE.Float32BufferAttribute([
          -baseX, 0, baseZ,
           0,     0, tipZ
        ], 3));
        this.el.object3D.add(new THREE.Line(leftGeo, new THREE.LineBasicMaterial({ color })));

        // Right arm: base-right to tip
        const rightGeo = new THREE.BufferGeometry();
        rightGeo.setAttribute('position', new THREE.Float32BufferAttribute([
          baseX, 0, baseZ,
          0,    0, tipZ
        ], 3));
        this.el.object3D.add(new THREE.Line(rightGeo, new THREE.LineBasicMaterial({ color })));
      }
    });
    //   #move-rig  — holds world XZ position, vr-locomotion lives here
    //   #turn-rig  — child of move-rig, holds only the right-stick yaw
    //   #camera    — child of turn-rig, WebXR writes head tracking here only
    //
    // Because turn is on a separate entity from the camera, WebXR head-tracking
    // cannot corrupt rigYaw, so forward/back always follows the rig facing direction.

    AFRAME.registerComponent('vr-locomotion', {
      init() {
        this.moveSpeed = 0.05;
        this.turnSpeed = 2.0;
        this.rigYaw    = 0;      // degrees, only ever changed by right stick
      },

      tick() {
        const session = this.el.sceneEl.xrSession;
        if (!session) return;

        let moveX = 0;
        let moveZ = 0;
        let turnX = 0;

        for (const source of session.inputSources) {
          if (!source.gamepad || !source.handedness) continue;
          const axes = source.gamepad.axes;
          if (source.handedness === 'left') {
            moveX = axes[2] || 0;
            moveZ = axes[3] || 0;
          }
          if (source.handedness === 'right') {
            turnX = axes[2] || 0;
          }
        }

        // Accumulate yaw from right stick only — never read back from any object3D
        this.rigYaw -= turnX * this.turnSpeed;

        // Apply turn to turn-rig
        const turnRig = document.querySelector('#turn-rig');
        if (turnRig) {
          turnRig.object3D.rotation.set(0, THREE.MathUtils.degToRad(this.rigYaw), 0);
        }

        // Movement vectors derived purely from rigYaw
        const rad  = THREE.MathUtils.degToRad(this.rigYaw);
        const fwdX =  Math.sin(rad);
        const fwdZ = -Math.cos(rad);
        const rgtX =  Math.cos(rad);
        const rgtZ =  Math.sin(rad);

        const pos = this.el.object3D.position;
        pos.x += (fwdX * -moveZ + rgtX * moveX) * this.moveSpeed;
        pos.z += (fwdZ * -moveZ + rgtZ * moveX) * this.moveSpeed;
      }
    });
  </script>
</head>

<body>

<a-scene background="color: #111">

  <!-- FLOOR GRID -->

  <a-entity floor-grid></a-entity>

  <!-- FLOOR -->

  <a-plane
    position="0 -0.01 0"
    rotation="-90 0 0"
    width="200"
    height="200"
    color="#222">
  </a-plane>

  <!-- PLAYER
       move-rig  : XZ position only, vr-locomotion drives it
       turn-rig  : right-stick yaw only, isolated from WebXR head tracking
       camera    : WebXR head tracking applies here, does not affect turn-rig
  -->

  <a-entity id="move-rig" vr-locomotion position="0 0 5">
    <a-entity id="turn-rig">
      <a-camera id="camera" position="0 1.6 0" wasd-controls-enabled="false"></a-camera>

      <!-- Direction indicator — ring + chevron directly below player -->
      <a-entity direction-indicator position="0 -1.55 0"></a-entity>
    </a-entity>
  </a-entity>

  <!-- COMPASS LABELS -->
  <a-entity compass-label="value: N" position="0 5 -40"></a-entity>
  <a-entity compass-label="value: S" position="0 5 40"  rotation="0 180 0"></a-entity>
  <a-entity compass-label="value: E" position="40 5 0"  rotation="0 -90 0"></a-entity>
  <a-entity compass-label="value: W" position="-40 5 0" rotation="0 90 0"></a-entity>

  <!-- LIGHTING -->
  <a-light type="ambient"     intensity="0.8"></a-light>
  <a-light type="directional" intensity="0.8" position="1 3 2"></a-light>

</a-scene>

</body>
</html>
