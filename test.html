<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VR Flight Test</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    AFRAME.registerComponent('floor-grid', {
      init() {
        const grid = new THREE.GridHelper(
          200,  // size
          200   // divisions
        );
        this.el.object3D.add(grid);
      }
    });

    // Locomotion: left stick moves/strafes, right stick turns
    // Uses session.inputSources directly — same approach as index.html
    AFRAME.registerComponent('vr-locomotion', {
      init() {
        this.moveSpeed = 0.05;   // metres per tick
        this.turnSpeed = 2.0;    // degrees per tick
        this.rigYaw    = 0;      // accumulated body yaw in degrees
      },

      tick() {
        const session = this.el.sceneEl.xrSession;
        if (!session) return;

        let moveX = 0;
        let moveZ = 0;
        let turnX = 0;

        for (const source of session.inputSources) {
          if (!source.gamepad || !source.handedness) continue;

          // Quest thumbstick: axes[2] = X, axes[3] = Y
          const axes = source.gamepad.axes;

          if (source.handedness === 'left') {
            moveX = axes[2] || 0;
            moveZ = axes[3] || 0;
          }

          if (source.handedness === 'right') {
            turnX = axes[2] || 0;
          }
        }

        // Turn rig
        this.rigYaw -= turnX * this.turnSpeed;
        this.el.object3D.rotation.y = THREE.MathUtils.degToRad(this.rigYaw);

        // Move relative to body facing direction
        const angle = THREE.MathUtils.degToRad(this.rigYaw);
        const fwdX =  Math.sin(angle);
        const fwdZ = -Math.cos(angle);
        const rgtX =  Math.cos(angle);
        const rgtZ =  Math.sin(angle);

        const pos = this.el.object3D.position;
        pos.x += (fwdX * -moveZ + rgtX * moveX) * this.moveSpeed;
        pos.z += (fwdZ * -moveZ + rgtZ * moveX) * this.moveSpeed;
      }
    });
  </script>
</head>

<body>

<a-scene background="color: #111">

  <!-- FLOOR GRID -->
  <a-entity floor-grid></a-entity>

  <!-- FLOOR -->
  <a-plane
    position="0 -0.01 0"
    rotation="-90 0 0"
    width="200"
    height="200"
    color="#222">
  </a-plane>

  <!-- PLAYER -->
  <a-entity
    id="rig"
    vr-locomotion
    position="0 1.6 5">

    <a-camera
      id="camera"
      wasd-controls-enabled="false">
    </a-camera>

  </a-entity>

  <!-- ORIGIN -->
  <a-box
    position="0 0.5 0"
    color="red">
  </a-box>

  <!-- NORTH -->
  <a-box
    position="0 0.5 -10"
    color="blue">
  </a-box>

  <!-- EAST -->
  <a-box
    position="10 0.5 0"
    color="green">
  </a-box>

  <!-- WEST -->
  <a-box
    position="-10 0.5 0"
    color="yellow">
  </a-box>

  <!-- FLIGHT TARGETS -->

  <a-box
    position="0 5 -20"
    color="orange">
  </a-box>

  <a-box
    position="10 10 -30"
    color="purple">
  </a-box>

  <a-box
    position="-15 8 -25"
    color="cyan">
  </a-box>

  <a-sphere
    position="0 15 -40"
    radius="2"
    color="#FF66AA">
  </a-sphere>

  <!-- LIGHTING -->

  <a-light
    type="ambient"
    intensity="0.8">
  </a-light>

  <a-light
    type="directional"
    intensity="0.8"
    position="1 3 2">
  </a-light>

</a-scene>

</body>
</html>
